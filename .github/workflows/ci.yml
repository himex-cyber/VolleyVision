# Runs on every push to main/develop and every pull request. CI never touches
# Supabase or deploys anything: deploys stay manual via deploy.ps1, and
# migrations are applied to staging/prod by hand with `prisma migrate deploy`.
# The db job uses its own throwaway Postgres service container.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # prisma validate/generate resolve the datasource env vars but never
      # connect; placeholders keep the job from needing any real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests (pure lib tests + import-cycle check)
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Proves the migrations build the schema from zero, that schema.prisma hasn't
  # drifted from them, and runs the integration tests (authz matrix, RLS) against
  # the real app. Postgres 17 matches prod.
  db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create the shadow database for the drift check
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE ci_shadow'
      - run: npm ci
      - run: npx prisma generate
      # Supabase's anon/authenticated roles and default grants, BEFORE the
      # migrations run, so rls.test.ts proves every table's grants are revoked.
      - name: Create the Supabase roles
        run: npx prisma db execute --url "$DATABASE_URL" --file scripts/supabase-roles.sql
      - name: Apply every migration from zero
        run: npx prisma migrate deploy
      # Exit code 2 on any difference. The one thing schema.prisma can't express,
      # the partial unique index team_memberships_one_head_coach (migration
      # 20260927130000), is ignored by Prisma 5.22's diff, so no allowlist is needed.
      - name: Drift check (migrations vs schema.prisma)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Integration tests
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  # The Android shell (Phase 5): a production sync must pass the prod-config
  # check (no cleartext, no mixed content, no remote server URL) and the debug
  # APK must build. No signing and no secrets here; release builds are signed
  # on Karlos's machine. JDK 21: Capacitor 8's Gradle needs it (the runner
  # defaults to 17).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The committed gradle-wrapper.jar is a binary we run; check it's Gradle's own.
      - uses: gradle/actions/wrapper-validation@v4
      - run: npm ci
      - name: Production sync
        run: npm run android:prod
      - name: Prod-config check
        run: node scripts/check-android-prod.mjs
      - name: Build the debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
